; Interlock Automation - firmware das 3 placas ESP32 (portaria, porta A e porta B).
;
; O mesmo código vai nas 3 placas: o papel de cada uma vem do ambiente escolhido.
; Na barra do PlatformIO: Project Tasks > porta_a > Upload, ou pelo terminal:
;   pio run -e porta_a -t upload
;
; Para atualizar sem cabo, use os ambientes *_ota (no fim deste arquivo) ou envie o
; arquivo .pio/build/<ambiente>/firmware.bin pela página da placa (Manutenção).

[platformio]
; "Build" compila as 3 placas (os ambientes de OTA e de teste ficam de fora).
default_envs = porteiro, porta_a, porta_b

; Configuração comum das placas ESP32.
[esp32]
; Versão fixa: uma atualização do PlatformIO não muda o comportamento do firmware.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
; Duas áreas de 1,9 MB para o firmware (necessário para atualizar pela rede) e quase nada
; para arquivos, que o projeto não usa. Mude a tabela de partições só pelo cabo USB.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_flags = -Wall -Wextra
; Mostra no monitor serial os erros da própria biblioteca do ESP32 (Wi-Fi, DHCP...), além do
; registro de eventos do firmware.
build_flags = -D CORE_DEBUG_LEVEL=1
upload_port = COM11
monitor_port = COM11

[env:porteiro]
extends = esp32
build_flags = ${esp32.build_flags} -D PAPEL_PORTEIRO

[env:porta_a]
extends = esp32
build_flags = ${esp32.build_flags} -D PAPEL_PORTA_A

[env:porta_b]
extends = esp32
build_flags = ${esp32.build_flags} -D PAPEL_PORTA_B

; ---------------------------------------------------------------------------------------
; Atualização pela rede (OTA) direto do VS Code: Project Tasks > porta_a_ota > Upload
;   1. Troque upload_port pelo IP da placa.
;   2. Crie a variável de ambiente INTERLOCK_SENHA com a SENHA_ADMIN e reabra o VS Code
;      (ou escreva a senha no lugar de ${sysenv.INTERLOCK_SENHA}, se este arquivo não for
;      para um repositório público).
; O envio usa a mesma rota da página, então a placa recusa o firmware de outro papel.
; ---------------------------------------------------------------------------------------
[ota]
upload_protocol = custom
upload_command = curl --fail-with-body --header "Expect:" --user admin:${sysenv.INTERLOCK_SENHA} --form firmware=@$SOURCE http://$UPLOAD_PORT/api/atualizar

[env:porteiro_ota]
extends = env:porteiro, ota
upload_port = 192.168.0.50

[env:porta_a_ota]
extends = env:porta_a, ota
upload_port = 192.168.0.51

[env:porta_b_ota]
extends = env:porta_b, ota
upload_port = 192.168.0.52

; ---------------------------------------------------------------------------------------
; Testes das regras do intertravamento e da proteção contra mensagens repetidas.
;   Numa placa ESP32 qualquer ligada no USB:  pio test -e testes
;   No PC (precisa de um gcc instalado, ex.: MSYS2/MinGW):  pio test -e testes_pc
; ---------------------------------------------------------------------------------------
[env:testes]
extends = esp32
build_src_filter = -<*> +<intertravamento.cpp> +<sessao.cpp>
test_build_src = yes

[env:testes_pc]
platform = native
build_src_filter = -<*> +<intertravamento.cpp> +<sessao.cpp>
test_build_src = yes
